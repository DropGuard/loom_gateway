quarkus.http.port=8080
quarkus.vertx.worker-pool.size=200

# NOTE: the dependency (java-gateway) also ships a @QuarkusMain
# (GatewayApplication). This app's main is disambiguated at build time via
# @QuarkusMain(name = "benchmark-loom") on BenchmarkLoomApplication.

# Point the library's RouteConfigLoader at the benchmark routes (mounted at
# /config/routes.yaml in the Docker compose).
gateway.config.path=/config/routes.yaml

# Make Quarkus index the java-gateway dependency so its @Singleton/@ApplicationScoped
# beans (GatewayRouter, FilterChains, the filters) are discovered by ArC.
quarkus.arc.auto-inject-fields=true
quarkus.index-dependency.com-gateway.group-id=com.github.dropguard
quarkus.index-dependency.com-gateway.artifact-id=loom-gateway

quarkus.log.level=INFO
quarkus.log.category."com.github.dropguard.loom".level=INFO
