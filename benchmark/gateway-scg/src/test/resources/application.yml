spring:
  cloud:
    gateway:
      routes:
        - id: bench-open
          uri: http://localhost:9561
          predicates:
            - Path=/bench/open/**
          filters:
            - name: Timeout
              args:
                timeout: 500
            - name: RateLimit
              args:
                limit: 1000
                windowMs: 1000
            - name: ResponseHeaders
              args:
                gateway: scg
        - id: bench-auth
          uri: http://localhost:9561
          predicates:
            - Path=/bench/auth/**
          filters:
            - name: JwtAuth
            - name: ClaimsForward
              args:
                claims:
                  - sub
                  - scope
            - name: Timeout
              args:
                timeout: 500
            - name: RateLimit
              args:
                limit: 1000
                windowMs: 1000
            - name: ResponseHeaders
              args:
                gateway: scg
        - id: bench-ratelimit
          uri: http://localhost:9561
          predicates:
            - Path=/bench/rl/**
          filters:
            - name: RateLimit
              args:
                limit: 5
                windowMs: 10000
            - name: ResponseHeaders
              args:
                gateway: scg
        - id: bench-cache
          uri: http://localhost:9561
          predicates:
            - Path=/bench/cache/**
          filters:
            - name: Cache
            - name: ResponseHeaders
              args:
                gateway: scg

gateway:
  jwt:
    secret: "bench-secret-key-that-is-at-least-32-chars!"
