server {
    listen 80;
    access_log off;

    # Deterministic per-route bodies so cache keying is stable across requests.
    location = /bench/open/data {
        default_type application/json;
        return 200 '{"status":"ok","route":"open"}';
    }

    location = /bench/auth/data {
        default_type application/json;
        return 200 '{"status":"ok","route":"auth","upstream":true}';
    }

    location = /bench/cache/data {
        default_type application/json;
        return 200 '{"status":"ok","route":"cache","server":1}';
    }

    location / {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
