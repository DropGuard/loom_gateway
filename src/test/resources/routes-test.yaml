routes:
  - id: api-users
    path: /api/users/**
    methods: [GET, POST]
    upstream: localhost:19999
    auth:
      type: jwt
      required: true
      secret: "this-is-a-test-secret-key-that-is-at-least-32-chars!"
    rateLimit:
      limit: 100
      windowMs: 1000
    circuitBreaker:
      failureThreshold: 3
      resetTimeoutMs: 5000
    cache:
      enabled: true
      ttlSeconds: 60

  - id: api-public
    path: /api/public/**
    methods: [GET]
    upstream: localhost:19999
    auth:
      type: none
      required: false
    rateLimit:
      limit: 100
      windowMs: 1000

  - id: api-key-service
    path: /api/external/**
    methods: [GET]
    upstream: localhost:19999
    auth:
      type: api-key
      required: true
      apiKeys:
        - "pk-test-key-123"

  - id: api-echo
    path: /api/echo/**
    methods: [POST]
    upstream: localhost:19999
    auth:
      type: none
      required: false

  - id: api-fail
    path: /api/fail/**
    methods: [GET]
    upstream: localhost:19998
    auth:
      type: none
      required: false
    circuitBreaker:
      failureThreshold: 3
      resetTimeoutMs: 1000
