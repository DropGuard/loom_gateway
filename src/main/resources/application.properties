# Quarkus Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Gateway Configuration
gateway.config.path=/config/routes.yaml

# Buffer request body for proxy forwarding
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=2M


# Timeout Configuration
gateway.timeout.connect=3000
gateway.timeout.read=5000
gateway.timeout.write=10000
gateway.timeout.idle=60000

# Logging
quarkus.log.category."com.gateway".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.registry.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# Health
quarkus.smallrye-health.root.path=/health
