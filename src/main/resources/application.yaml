quarkus:
  http:
    port: 8080
    host: 0.0.0.0
    body:
      # Gateway proxies JSON APIs; file uploads are not handled upstream, so
      # multipart handling is disabled (DEFECT review: keep attack surface minimal).
      handle-file-uploads: false
    limits:
      max-body-size: 2M
  # Graceful shutdown (DEFECT #19): let in-flight requests finish before the
  # pod stops. Quarkus handles the shutdown sequence itself -- we only make the
  # timeout explicit and auditable instead of relying on the 30s default.
  # MUST be <= Kubernetes terminationGracePeriodSeconds (default 30s) once this
  # is deployed, or the kubelet SIGKILLs the pod before Quarkus drains traffic.
  shutdown:
    timeout: 30s
  log:
    category:
      "com.github.dropguard.loom":
        level: INFO
    console:
      enabled: true
      # traceId/spanId are injected into the MDC by quarkus-opentelemetry per
      # request, so a single grep on %X{traceId} reconstructs a whole request
      # across filter -> router -> upstream.
      format: "%d{HH:mm:ss} %-5p [%c{2.}] [%X{traceId}] (%t) %s%e%n"
      level: INFO
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
  otel:
    # Generate traceId/spanId and populate the logging MDC, but do not push
    # spans to a collector by default (no OTLP endpoint in dev/test). Flip
    # 'enabled: true' and set otel.exporter.otlp.endpoint when a collector exists.
    traces:
      enabled: true
    exporter:
      otlp:
        enabled: false

gateway:
  config:
    path: /config/routes.yaml
  timeout: 5000
  cors:
    # Gateway-owned CORS (the framework's quarkus.http.cors does not apply to
    # @Route reactive routes, so the gateway writes these headers itself).
    enabled: true
    # Allow-list injected via env (e.g. CORS_ORIGINS="https://app.example.com").
    # ".*" is the local-dev/unspecified default; production must pin real origins.
    origins: "${CORS_ORIGINS:.*}"
    methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    headers: Authorization,Content-Type,X-API-Key
    exposed-headers: X-Request-Id
    max-age: 86400
  gray:
    # Client-facing gray headers stripped at ingress. A trusted layer must use a
    # *different* dedicated header (e.g. X-Internal-Canary) to opt requests into
    # the canary; clients can never forge or strip these.
    headers:
      - X-Canary
