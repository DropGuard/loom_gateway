services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
    environment:
      # Keep in sync with the Dockerfile ENV and the benchmark methodology:
      # benchmark/RESULTS.md pins -Xms256m -Xmx256m -XX:+AlwaysPreTouch -XX:+UseG1GC
      # on JDK 25. The previous ZGC/64m heap setting silently diverged from both.
      - JAVA_OPTS=-Xms256m -Xmx256m -XX:+AlwaysPreTouch -XX:+UseG1GC -Djava.util.logging.manager=org.jboss.logmanager.LogManager
      # 本地 docker compose 专用占位值 —— 切勿复制到生产!
      # 生产环境通过 Kubernetes Secret(envFrom.secretRef)注入真实密钥;
      # 若未注入, 网关注入的路由将带空密钥, 认证请求返回 401/500。
      - JWT_SECRET=CHANGE_ME_LOCAL_DOCKER_COMPOSE_ONLY_32chars_min!!
      - API_KEY_1=CHANGE_ME_LOCAL_API_KEY_1
      - API_KEY_2=CHANGE_ME_LOCAL_API_KEY_2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/q/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gateway-net

  # Mock backend for testing
  mock-backend:
    image: kennethreitz/httpbin:latest
    container_name: mock-backend
    ports:
      - "8081:80"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
